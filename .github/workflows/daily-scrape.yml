name: Daily brochure scrape

on:
  # 15:10 Europe/Sofia = 12:10 UTC при лятно часово време (UTC+3).
  # След теста смени на 09:00 София: 6:00 UTC лято / 7:00 UTC зима.
  schedule:
    - cron: '00 13 * * *'
  workflow_dispatch:

concurrency:
  group: daily-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: save-money-be
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: Europe/Sofia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "${SUPABASE_URL}" ]; then
            echo "Липсва repository secret: SUPABASE_URL"
            missing=1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Липсва repository secret: SUPABASE_SERVICE_ROLE_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Добави ги в GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Required secrets are present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: save-money-be/package-lock.json

      - name: Install Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            fonts-liberation \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            xdg-utils
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - name: Install npm dependencies
        run: npm ci

      - name: Run daily scrape
        timeout-minutes: 28
        run: npm run scrape:daily
